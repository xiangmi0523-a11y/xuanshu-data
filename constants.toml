# 玄枢契约里的常量与已定结论 —— 只在这里写一次
#
# 契约正文引用这里的值，不再在多处重复书写；
# checks/verify.py 把下面每一条当断言跑，数据一变、结论不成立，CI 就变红。

[time]
tz_offset_hours = 8
day_rollover = "00:00:00"
# 子时窗口：[D-1 日 23:00:00, D 日 01:00:00)，左闭右开【B4-14】
zi_window_start = "23:00:00"
zi_window_end_exclusive = "01:00:00"
# 1972-01-01 前用 UT1，之后用 UTC（闰秒表），表末后不再加闰秒【B4-12】
utc_from = "1972-01-01"

# 叠加用例年份的校验规则（文件头规则 2）【B4-13 / B4-14】
# 用例本身显式写年份；这里重新筛一遍，结果必须等于 decided_year
[superposition_selector]
min_year = 1972
term_hour = 23                 # 交节落在 D 前一晚 23 点段（晚子时）
min_margin_minutes = 20        # 离 23:00 与离 00:00 都 > 20 分钟
pick = "earliest"

[[superposition_case]]
id = "SHICHEN_ZI_AND_JINGZHE_SUPERPOSITION"
term = "惊蛰"
decided_year = 2018
term_utc8 = "2018-03-05T23:28:11+08:00"
fixed_utc8_date = "2018-03-06"
day_candidates = ["丙申", "丁酉"]
required = true
decision = "B4-13"

[[superposition_case]]
