<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>八字结果 · 阻断</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A68;text-decoration:none}a:hover{color:#1E3550}
</style>
</helmet>
<div style="width: 390px; height: 930px; background: #F3EEE6; font-family: 'Noto Sans SC', sans-serif; color: #1E2833; display: flex; flex-direction: column; overflow: hidden">

  <header style="position: relative; padding: 54px 16px 10px; display: flex; align-items: center; gap: 4px">
    <svg aria-hidden="true" width="390" height="110" viewBox="0 0 390 110" style="position: absolute; left: 0; top: 0"><path d="M0 92 C50 70 90 62 130 78 C170 52 214 48 250 70 C290 54 340 60 390 76 L390 110 L0 110Z" fill="#8C99A8" opacity="0.18"></path></svg>
    <a href="BaziInput.dc.html" aria-label="返回" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2833" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="position: relative; margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 20px; letter-spacing: 1px">示例丁 · 女</h1>
  </header>

  <main style="display: flex; flex-direction: column; gap: 14px; padding: 0 20px">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 16px; background: #F5E1DB; border: 1px solid #DDAEA4; border-radius: 18px; text-align: center">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: #8E2F22; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBF8F2" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M6.5 6.5l11 11"></path></svg>
      </span>
      <span style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 19px; color: #6E2218">阻断 · 暂不能出结果</span>
      <span style="font-size: 13px; line-height: 1.7; color: #4A1C15">还缺 1 项必须由你确认的信息。补齐后即可排盘。</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
      <span style="font-size: 14px">1946年5月12日 09:40 · 上海黄浦</span>
      <span style="font-size: 13px; color: #4F5966">尚未生成任何柱</span>
    </div>

    <section style="background: #FBF8F2; border: 1px solid #E4DACB; border-radius: 18px; padding: 6px 16px; display: flex; flex-direction: column">
      <div style="display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E4DACB">
        <span style="width: 24px; height: 24px; border-radius: 12px; background: #8E2F22; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBF8F2" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 6px; flex: 1">
          <span style="font-size: 15px; font-weight: 700">出生地时区未确认</span>
          <span style="font-size: 13px; line-height: 1.65; color: #3F4955">1949 年以前内地出生，当时的时区与夏令时须你核对后确认。</span>
          <button type="button" style="align-self: flex-start; height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #8E2F22; color: #FBF8F2; font: inherit; font-size: 14px; font-weight: 700">去确认时区</button>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #E4DACB">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#24573F" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l4.5 4.5L19 7"></path></svg>
        <span style="font-size: 14px; flex: 1">性别</span><span style="font-size: 13px; color: #4F5966">女</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #E4DACB">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#24573F" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l4.5 4.5L19 7"></path></svg>
        <span style="font-size: 14px; flex: 1">时间精度</span><span style="font-size: 13px; color: #4F5966">精确到分钟</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#24573F" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l4.5 4.5L19 7"></path></svg>
        <span style="font-size: 14px; flex: 1">出生地点与经度</span><span style="font-size: 13px; color: #4F5966">东经 121.49°</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #4F5966; padding: 0 4px">暂存后在历史中的样子</h2>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px dashed #A9A196; border-radius: 14px; background: transparent">
        <span style="width: 40px; height: 40px; border-radius: 10px; border: 1.5px dashed #A9A196; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6874" stroke-width="2" stroke-linecap="round"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 700; color: #4F5966">未完成配置 · 示例丁</span>
          <span style="font-size: 12px; color: #5E6874">无命盘 · 待确认时区</span>
        </span>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 48px; border-radius: 24px; border: 1px solid #C9BBA6; background: transparent; color: #2F4A68; font: inherit; font-size: 15px">存为未完成配置</button>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 1.7; color: #5E6874; padding: 0 4px">其他会阻断的情况：出生时刻超出支持范围（当前支持 1900 年至 2100 年，具体边界由历法数据覆盖范围决定）；选真太阳时但缺经度；只知时辰又选真太阳时（本版暂未实现）。</p>
  </main>
</div>
</x-dc>

</body>
</html>
