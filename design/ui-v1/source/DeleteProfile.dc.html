<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>删除个人资料确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A68;text-decoration:none}a:hover{color:#1E3550}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 870px; background: #F3EEE6; font-family: 'Noto Sans SC', sans-serif; color: #1E2833; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 54px 16px 6px; display: flex; align-items: center; gap: 4px">
    <a href="Settings.dc.html" aria-label="返回设置" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2833" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 20px; letter-spacing: 1px">删除出生资料</h1>
  </header>

  <main style="display: flex; flex-direction: column; gap: 14px; padding: 0 20px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 0 6px; text-align: center">
      <span style="width: 52px; height: 52px; border-radius: 26px; background: #F5E1DB; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E2F22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"></path></svg>
      </span>
      <span style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 20px">删除「示例甲」的全部资料？</span>
      <span style="font-size: 13px; color: #3F4955">删除后无法在 App 内恢复。</span>
    </div>

    <section style="background: #FBF8F2; border: 1px solid #E4DACB; border-radius: 18px; padding: 6px 16px">
      <h2 style="margin: 10px 0 4px; font-size: 13px; font-weight: 500; color: #4F5966">将一并删除</h2>
      <div style="display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid #ECE3D5; font-size: 14px"><span style="flex: 1">出生资料</span><span style="color: #4F5966">1 份</span></div>
      <div style="display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid #ECE3D5; font-size: 14px"><span style="flex: 1">结果快照</span><span style="color: #4F5966">2 条</span></div>
      <div style="display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid #ECE3D5; font-size: 14px"><span style="flex: 1">未完成草稿</span><span style="color: #4F5966">1 份</span></div>
      <div style="display: flex; align-items: center; min-height: 44px; font-size: 14px"><span style="flex: 1">研究记录</span><span style="color: #4F5966">3 条</span></div>
    </section>

    <section style="display: flex; gap: 10px; padding: 14px; background: #F5E1DB; border: 1px solid #DDAEA4; border-radius: 16px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E2F22" stroke-width="2.2" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.7; color: #4A1C15">
        <b>导出到设备外、云盘、系统整机备份（如 iCloud）或发给他人的副本，App 无法删除。</b>
        <span>以后从旧备份恢复时，已删除的档案默认不恢复，并会提示你。</span>
      </span>
    </section>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="cf" style="font-size: 13px; color: #4F5966">输入资料名称“示例甲”以确认</label>
      <input id="cf" placeholder="示例甲" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #DCD0BE; border-radius: 12px; background: #FFFDF9; color: #1E2833; font-size: 16px">
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
      <button type="button" style="height: 52px; border-radius: 26px; border: none; background: #8E2F22; color: #FBF8F2; font: inherit; font-size: 16px; font-weight: 700">永久删除</button>
      <a href="Settings.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid #C9BBA6; display: flex; align-items: center; justify-content: center; font-size: 15px">取消</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":870}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
