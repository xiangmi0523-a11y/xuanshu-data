# 玄枢数据正本清单
#
# 规则：仓库里每一个数据文件、生成脚本都必须登记在这里；
#       checks/verify.py 逐条核对 sha256 与行数，对不上 CI 就变红。
#       改文件 = 同一次提交里改这里的 sha256，并写明依据（裁决号）。
#
# status:
#   formal   正式文件，必须在仓库里，哈希必须一致
#   recheck  独立复算件，用于交叉核对，不作为正式依据
#   source   原始资料（星历、年历抄取结果等）
#   pending  已登记、文件尚未放进仓库；放进来后按登记的 sha256 核对
#
# rows = 不含表头的数据行数

